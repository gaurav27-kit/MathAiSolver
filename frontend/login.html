<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathAI - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/styles/style.css">
</head>

<body>
    <div class="auth-split-layout">
        <!-- Brand / Graphic Side -->
        <div class="auth-split-brand">
            <div class="auth-orb auth-orb-1"></div>
            <div class="auth-orb auth-orb-2"></div>

            <div class="logo-large">
                <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="var(--primary-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="5" x2="5" y2="19"></line>
                    <circle cx="6.5" cy="6.5" r="2.5"></circle>
                    <circle cx="17.5" cy="17.5" r="2.5"></circle>
                </svg> MathAI
            </div>
            <p class="brand-copy">
                Welcome back! Log in to continue your mathematical journey. Access your saved equations, probability solutions, and calculus history effortlessly.
            </p>
        </div>

        <!-- Form Side -->
        <div class="auth-split-form">
            <div class="auth-form-glass">
                <a href="index.html" class="back-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                         <line x1="19" y1="12" x2="5" y2="12"></line>
                         <polyline points="12 19 5 12 12 5"></polyline>
                    </svg> Back to Home
                </a>

                <h3>Sign in</h3>
                <p class="sub-copy">Enter your credentials to access your account.</p>

                <form id="loginForm" class="auth-form-area">
                    <div class="form-group">
                        <label for="authEmail">Email address</label>
                        <input type="email" id="authEmail" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="authPassword">Password</label>
                        <input type="password" id="authPassword" placeholder="Enter your password" required>
                    </div>

                    <div id="authMessage" class="helper-text error-text" style="min-height: 1.5rem; margin-top: 0.25rem;"></div>

                    <button id="authSubmitBtn" class="btn btn-primary auth-submit" type="submit">Login to account</button>

                    <!-- Divider -->
                    <div style="display:flex;align-items:center;gap:0.75rem;margin:1.25rem 0;">
                        <div style="flex:1;height:1px;background:var(--border-color,#e2e8f0);"></div>
                        <span style="color:var(--text-muted);font-size:0.85rem;">or</span>
                        <div style="flex:1;height:1px;background:var(--border-color,#e2e8f0);"></div>
                    </div>

                    <!-- Google Sign-In Button -->
                    <a id="googleLoginBtn" href="https://mathaisolver.onrender.com/auth/google"
                       style="display:flex;align-items:center;justify-content:center;gap:0.75rem;
                              width:100%;padding:0.75rem 1rem;border-radius:10px;
                              border:1.5px solid var(--border-color,#e2e8f0);
                              background:#fff;color:#3c4043;font-size:0.95rem;font-weight:500;
                              text-decoration:none;transition:box-shadow 0.2s,border-color 0.2s;
                              cursor:pointer;">
                        <!-- Google G logo SVG -->
                        <svg width="20" height="20" viewBox="0 0 48 48">
                            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                        </svg>
                        Continue with Google
                    </a>

                    <div style="text-align: center; margin-top: 1.5rem;">
                        <span style="color: var(--text-muted);">Don't have an account? </span>
                        <a href="register.html" style="color: var(--primary-color); text-decoration: none; font-weight: 600;">Register here</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="src/services/api-base.js"></script>
    <script src="src/services/api-utils.js"></script>
    <script src="src/services/google-auth.js"></script>
    <script src="src/pages/login.js"></script>
</body>

</html>
